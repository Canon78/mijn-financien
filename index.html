<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financieel Dashboard</title>
  <!-- Tailwind CSS voor styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js voor grafieken -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse voor CSV verwerking -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">💰 Financieel Dashboard</h1>
    
    <!-- Upload sectie -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Upload je bank CSV-bestand:</label>
      <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
    </div>

    <!-- Stat kaarten -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
        <h2 class="text-sm font-medium text-gray-500">Inkomsten</h2>
        <p id="totalIncome" class="text-2xl font-bold text-green-600">€0,00</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-red-500">
        <h2 class="text-sm font-medium text-gray-500">Uitgaven</h2>
        <p id="totalExpenses" class="text-2xl font-bold text-red-600">€0,00</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
        <h2 class="text-sm font-medium text-gray-500">Netto Resultaat</h2>
        <p id="netBalance" class="text-2xl font-bold text-blue-600">€0,00</p>
      </div>
    </div>

    <!-- Grafiek -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-bold mb-4 text-gray-700">Uitgaven per Categorie</h2>
      <div class="w-full max-w-md mx-auto">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      'Boodschappen': ['albert heijn', 'jumbo', 'lidl', 'aldi', 'carrefour', 'colruyt', 'delhaize'],
      'Vaste Lasten': ['huur', 'hypotheek', 'energie', 'water', 'engie', 'fluvius', 'vandebron'],
      'Abonnementen': ['spotify', 'netflix', 'disney', 'icloud', 'kpn', 'ziggo', 'proximus', 'telenet'],
      'Transport': ['ns', 'nmbs', 'shell', 'bp', 'eene', 'tank', 'de lijn'],
      'Horeca & Vrije tijd': ['restaurant', 'café', 'cafe', 'thuisbezorgd', 'ubereats', 'bioscoop']
    };

    let chartInstance = null;

    document.getElementById('csvFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
          processData(results.data);
        }
      });
    });

    function categorize(description) {
      if (!description) return 'Overig';
      const descLower = description.toString().toLowerCase();
      for (const [cat, keywords] of Object.entries(CATEGORIES)) {
        if (keywords.some(kw => descLower.includes(kw))) {
          return cat;
        }
      }
      return 'Overig';
    }

    function processData(rows) {
      let income = 0;
      let expenses = 0;
      const categoryTotals = {};

      rows.forEach(row => {
        // Zoek naar kolommen voor bedrag en omschrijving
        const keys = Object.keys(row);
        const amountKey = keys.find(k => k.toLowerCase().includes('bedrag') || k.toLowerCase().includes('amount'));
        const descKey = keys.find(k => k.toLowerCase().includes('naam') || k.toLowerCase().includes('omschrijving') || k.toLowerCase().includes('memo'));

        if (!amountKey) return;

        let rawAmount = row[amountKey];
        if (typeof rawAmount === 'string') {
          rawAmount = parseFloat(rawAmount.replace(',', '.'));
        }

        if (isNaN(rawAmount)) return;

        const description = descKey ? row[descKey] : '';

        if (rawAmount > 0) {
          income += rawAmount;
        } else {
          const absAmount = Math.abs(rawAmount);
          expenses += absAmount;
          const cat = categorize(description);
          categoryTotals[cat] = (categoryTotals[cat] || 0) + absAmount;
        }
      });

      // Update Kaarten
      document.getElementById('totalIncome').innerText = `€${income.toFixed(2)}`;
      document.getElementById('totalExpenses').innerText = `€${expenses.toFixed(2)}`;
      document.getElementById('netBalance').innerText = `€${(income - expenses).toFixed(2)}`;

      // Update Grafiek
      renderChart(categoryTotals);
    }

    function renderChart(categoryTotals) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categoryTotals),
          datasets: [{
            data: Object.values(categoryTotals),
            backgroundColor: ['#f59e0b', '#ef4444', '#8b5cf6', '#3b82f6', '#10b981', '#6b7280']
          }]
        }
      });
    }
  </script>
</body>
</html>
